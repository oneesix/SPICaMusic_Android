      - name: Apply the update
        run: |
          F=app/src/main/java/me/spica27/spicamusic/ui/widget/LyricUI.kt
          W=app/src/main/java/me/spica27/spicamusic/ui/widget
          fix_import() {
            if [ -f "$F" ]; then
              sed -i 's/^import androidx.compose.animation.core.EnterExitState$/import androidx.compose.animation.EnterExitState/' "$F"
            fi
          }
          fix_import
          # The background vocal rebuild was dismissed: take it out first if it is in this fork.
          if git apply --check --reverse --whitespace=nowarn /tmp/p/bg.patch 2>/dev/null; then
            git apply --reverse --whitespace=nowarn /tmp/p/bg.patch
            echo "Removed the dismissed background vocal fix first"
          fi
          fix_import
          START=0
          for k in 1 2 3 4 5; do
            if git apply --check --whitespace=nowarn /tmp/p/d$k.patch 2>/dev/null; then START=$k; break; fi
          done
          if [ "$START" = "0" ]; then
            if git apply --check --reverse --whitespace=nowarn /tmp/p/d5.patch 2>/dev/null; then
              echo "The final update is already applied"
            else
              echo "The update does not fit this version of the code. What this fork looks like:"
              git log -3 --format='  commit %h %s' || true
              for f in LyricUI.kt LyricInterludes.kt LyricsSettingsSheet.kt LyricsFonts.kt LyricBackgroundReveal.kt; do
                if [ -f "$W/$f" ]; then echo "  $f: present"; else echo "  $f: missing"; fi
              done
              echo "  LyricUI.kt markers: break dots=$(grep -c InterludeLine "$F") attach words=$(grep -c attachedRomanizationFor "$F") bg reveal=$(grep -c BackgroundReveal "$F") bg open time=$(grep -c openAtMs "$F")"
              for k in 1 2 3 4 5; do
                echo "  --- why stage $k does not apply:"
                git apply --check --whitespace=nowarn /tmp/p/d$k.patch 2>&1 | head -4 | sed 's/^/    /'
              done
              exit 1
            fi
          else
            echo "Starting from stage $START of 5"
            for k in $(seq $START 5); do
              git apply --whitespace=nowarn /tmp/p/d$k.patch
              fix_import
              echo "Applied stage $k"
            done
          fi
          fix_import
      - name: Commit and push
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Lyrics settings, animation, break dots, attach to words: final update"
          git push
