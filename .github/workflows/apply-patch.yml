name: Apply patch

on:
  workflow_dispatch:
    inputs:
      patch:
        description: "Patch file name in the repo root"
        required: true
        default: "update-bottom-bar-blur-styles.patch"
      message:
        description: "Commit message"
        required: true
        default: "Bottom bar: icon on/off states and spread blur"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: |
          git apply --check "${{ inputs.patch }}"
          git apply "${{ inputs.patch }}"

      - name: Remove patch file and commit
        run: |
          rm -f "${{ inputs.patch }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "${{ inputs.message }}"
          git push
